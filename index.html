<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsão ECMWF - 15 Dias</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap');

        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Google Sans", sans-serif;
            margin: 0;
            padding: 20px;
        }

        div, input {
            border-radius: 8px;
        }

        .weather-app-container {
            max-width: 600px;
            margin: 0 auto;
        }

        .search-box-container {
            margin-bottom: 20px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            box-sizing: border-box;
            border: 2px solid lightgray;
            font-family: "Google Sans", sans-serif;
        }

        .suggestions-container {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #ffffff;
            border: 1px solid lightgray;
            border-top: none;
            max-height: 150px;
            overflow-y: auto;
            display: none;
            z-index: 10;
        }

        .suggestion-item {
            padding: 10px;
            cursor: pointer;
            font-family: "Google Sans", sans-serif;
        }

        .suggestion-item:hover {
            background-color: #f0f0f0;
        }

        .history-container {
            margin-bottom: 50px;
            padding: 10px 0;
        }

        .history-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .history-list {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .history-item {
            padding: 5px 10px;
            border: 2px solid lightgray;
            cursor: pointer;
            background: #fff;
        }

        .history-item:hover {
            border: 2px solid rgb(77, 76, 76);
        }

        .current-location-div {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .forecast-container {
            display: flex;
            flex-direction: column;
            gap: 50px;
            margin-top: 50px;
        }


        .card-header-div {
            font-weight: bold;
            margin-bottom: 10px;
            padding-bottom: 5px;
        }

        .weekend-header {
            color: #b8860b; 
        }

        .card-body-div {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .weather-metric-div {
            display: flex;
            justify-content: space-between;
            border: 2px solid white;
            padding: 10px;
            cursor: pointer;
            background: #fff;
        }

        .weather-metric-div:hover {
            border: 2px solid rgb(219, 219, 219);
        }

        .metric-label-div {
            align-self: center;
        }

        .metric-value-div {
            font-size: 16px;
            font-weight: bold;
            display: flex;
            gap: 6px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            border-radius: 0px;
        }

        .modal-content-container {
            background: #ffffff;
            padding: 20px;
            width: 80%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-header-div {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 15px;
            padding-bottom: 5px;
        }

        .modal-close-button {
            float: right;
            cursor: pointer;
            font-weight: bold;
            color: #b7b7b7;
            font-size: 18px;
            padding: 3px 10px;
        }

        .modal-close-button:hover {
            color: #555;
        }

        .modal-row-div {
            display: flex;
            justify-content: space-between;
            padding: 7px 6px;
            border-radius: 0px;
            margin-bottom: 5px;
            border-radius: 6px;
            border: 2px solid lightgray;
            align-items: center;
        }

        .modal-row-time-div {
            font-weight: normal;
        }

        .modal-row-value-div {
            font-weight: bold;
            display: flex;
            gap: 6px;
        }

        .current-hour-highlight {
            border: 2px solid black;
        }

        .modal-group-separator {
            font-weight: bold;
            padding: 5px 0px;
            margin-top: 10px;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .bg-condition {
            background-color: #f0f0f0;
        }

        .bg-temp {
            background-color: #fff3e3;
        }

        .bg-precip {
            background-color: aliceblue;
        }

        .bg-wind {
            background-color: #d5fff4;
        }

        @media (max-width: 600px) {
            .weather-metric-div {
                display: flex;
                justify-content: space-between;
            }

            .card-body-div {
                grid-template-columns: 1fr;
            }

            .metric-label-div, .metric-value-div {
                margin-bottom: 0px;
                align-self: center;
            }
        }
    </style>
</head>
<body>

    <div style="justify-self: center;">
        <h1>Previsão do tempo</h1>
    </div>
    

    <div class="weather-app-container">
        <div class="search-box-container">
            <input type="text" id="searchInput" class="search-input" placeholder="Digite o nome da cidade...">
            <div id="suggestionsContainer" class="suggestions-container"></div>
        </div>

        <div id="historyContainer" class="history-container" style="display: none;">
            <div class="history-title">Buscas Recentes:</div>
            <div id="historyList" class="history-list"></div>
        </div>

        <div id="currentLocationContainer" class="current-location-div" style="display: none;"></div>
        <div>Modelo ECMWF IFS 9Km</div>
        <div style="margin-bottom: 20px;">Fonte: Open-meteo API</div>

        <div id="forecastContainer" class="forecast-container"></div>
    </div>

    <div id="modalOverlay" class="modal-overlay" style="display: none;">
        <div class="modal-content-container">
            <span id="modalClose" class="modal-close-button">x</span>
            <div id="modalHeader" class="modal-header-div"></div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
