<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Previsão do Tempo</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="icone.ico" type="image/x-icon">
</head>
<body>

  <header>
    <h1>Previsão do Tempo</h1>
  </header>

  <div id="box-search">
    <div class="search-wrapper">
      <input id="cidadeInput" placeholder="Digite a cidade" autocomplete="off">
      <div id="suggestions" class="suggestions"></div>
    </div>

    <button id="btnBuscar">Buscar</button>

    <div id="historico"></div>
  </div>


  <h2 id="cidade"></h2>
  

  <a href="mapas.html" id="btn-mapas" target="_blank"><h3>Mapas de chuva - Brasil</h3></a>

  <div id="container">
    <!-- Os cards de cada dia serão gerados aqui dinamicamente pelo JavaScript -->
  </div>

  <footer>
    <h4 class="info-modelo">Dados por ECMWF/Open-Meteo API</h4>
    <h4 class="info-icones">Icones criados e fornecidos por <a href="https://content.meteoblue.com/pt/pesquisa-educacao/especificacoes/standards/simbolos-e-pictogramas">Meteoblue</a></h4>
  </footer>

  <script type="module" src="./main.js"></script>
