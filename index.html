<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Previsão do Tempo</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap');
    
    body {
      font-family: "Google Sans", sans-serif;
      margin: 20px auto;
      padding: 0 15px;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .search-container {
      position: relative;
      margin-bottom: 20px;
      box-sizing: border-box;
      width: 100%;
      max-width: 650px;
    }
    
    input[type="text"] {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-family: "Google Sans", sans-serif;
    }
    
    .suggestions {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #fff;
      border: 1px solid #ccc;
      border-top: none;
      border-radius: 0 0 4px 4px;
      max-height: 200px;
      overflow-y: auto;
      z-index: 1000;
    }
    
    .suggestion-item {
      padding: 10px;
      cursor: pointer;
      font-family: "Google Sans", sans-serif;
    }
    
    .suggestion-item:hover {
      background-color: #eee;
    }
    
    .card {
      margin-bottom: 20px;
      width: 100%;
      max-width: 650px;
      box-sizing: border-box;
    }
    
    .location-header {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 5px;
    }
    
    .coords, .data-source {
      font-size: 14px;
      color: #666;
      margin-bottom: 10px;
    }

    .table-responsive {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 5px;
    }

    table {
      border-collapse: collapse;
      margin-top: 10px;
      white-space: nowrap;
      width: 100%;
    }
    
    th, td {
      border: 1px solid #ddd;
      padding: 8px 14px;
      font-size: 14px;
      text-align: left !important;
      vertical-align: middle;
      box-sizing: border-box;
    }
    
    th:nth-child(2),
    td:nth-child(2) {
      text-align: center !important;
      vertical-align: middle !important;
    }
    
    th {
      background-color: #000;
      color: white;
      font-weight: bold;
    }

    tr.weekend {
      background-color: #fefae8;
    }

    tr.clickable-row {
      cursor: pointer;
      transition: background-color 0.2s;
    }

    tr.clickable-row.active-row {
      font-weight: bolder;
    }

    tr.accordion-row > td {
      padding: 0;
      background-color: #f8fafc;
      border-top: none;
    }

    .accordion-content {
      background-color: #f8fafc;
    }

    .hourly-tabs {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .hourly-tabs .tab-btn {
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-family: "Google Sans", sans-serif;
      font-weight: 500;
      transition: background-color 0.2s, color 0.2s;
      background-color: #e2e8f0;
      color: #333;
    }

    .hourly-tabs .tab-btn:hover {
      opacity: 0.85;
    }

    .period-rain-summary {
      font-size: 13px;
      color: #555;
      margin-top: 10px;
      margin-bottom: 10px;
      font-family: "Google Sans", sans-serif;
      width: 250px;
      justify-self: center;
    }

    .hourly-forecast-table {
      width: 100%;
      border-collapse: collapse;
      background-color: #fff;
      margin-top: 0;
    }

    .hourly-forecast-table td {
      font-size: 13px;
      padding: 8px 14px;
      text-align: left !important;
    }

    .hourly-forecast-table td:nth-child(2) {
      text-align: center !important;
      vertical-align: middle !important;
    }

    tr.current-hour-row {
      background-color: #f1f1f1 !important;
    }

    #long-term-rain-summary {
      justify-self: left;
    }
  </style>
</head>
<body>

  <h1>Previsão do Tempo</h1>

  <div id="search-box-container" class="search-container">
    <input type="text" id="city-input" placeholder="Digite o nome da cidade..." autocomplete="off">
    <div id="suggestions" class="suggestions" style="display: none;"></div>
  </div>

  <div id="weather-card" class="card" style="display: none;">
    <div id="location-name" class="location-header"></div>
    <div id="location-coords" class="coords"></div>
    <div class="data-source">Fonte dos dados: ECMWF HRES 9km / Open-Meteo API</div>

    <h3>Previsão Diária <small style="font-size: 12px; font-weight: normal; color: #666;">(Toque/clique para ver detalhes)</small></h3>
    
    <!-- Tabela Principal (Responsiva com barra de rolagem horizontal) -->
    <div class="table-responsive">
      <table id="forecast-table">
        <thead>
          <tr>
            <th>Data</th>
            <th>Condição</th>
            <th>Temp (°C)</th>
            <th>Chuva (mm)</th>
            <th>Ventos (km/h)</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div id="long-term-rain-summary" class="period-rain-summary"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
