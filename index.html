<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Previsão do Tempo</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap');

    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Google Sans", sans-serif;
      margin: 15px auto;
      padding: 0 10px;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #f8fafc;
    }

    h1 {
      margin-bottom: 15px;
      font-size: 24px;
    }

    .search-container {
      position: relative;
      margin-bottom: 15px;
      width: 100%;
      max-width: 400px;
    }

    #city-input {
      width: 100%;
      padding: 10px 14px;
      font-size: 15px;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
      font-family: "Google Sans", sans-serif;
    }

    #city-input:focus {
      border-color: #0f172a;
    }

    .suggestions {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: white;
      border: 2px solid #cbd5e1;
      border-top: none;
      border-radius: 0 0 8px 8px;
      z-index: 10;
      max-height: 200px;
      overflow-y: auto;
    }

    .suggestion-item {
      padding: 10px 14px;
      cursor: pointer;
      font-size: 14px;
      font-family: "Google Sans", sans-serif;
    }

    .suggestion-item:hover {
      background-color: #f1f5f9;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 14px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }

    .location-header {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 2px;
    }

    .coords {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 6px;
    }

    .data-source {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 14px;
    }

    h3 {
      margin-bottom: 10px;
      font-size: 15px;
    }

    /* Cards Diários e de Horas Compactos */
    .day-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border: 2px solid #e2e8f0;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      cursor: pointer;
      background: #fff;
      transition: all 0.2s ease;
    }

    .day-card:hover {
      border-color: #cbd5e1;
    }

    .day-card.active-card {
      border-color: #0f172a;
      background-color: #f8fafc;
    }

    .day-card.weekend > .card-date {
      color: goldenrod;
    }

    .card-date {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      font-size: 14px;
      color: #0f172a;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 4px;
    }

    .card-condition {
      font-weight: bolder;
      color: white;
      font-size: 12px;
      background-color: #475569;
      padding: 3px 8px;
      border-radius: 5px;
    }

    .card-temp, .card-rain, .card-wind, .card-gust, 
    .hourly-condition, .hourly-temp, .hourly-rain, .hourly-wind, .hourly-gust {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      font-size: 13px;
    }

    .current-hour > .hourly-hour {
      color: dodgerblue;
    }

    .hourly-condition {
      font-weight: bolder;
      color: white;
      font-size: 12px;
      background-color: #475569;
      padding: 3px 8px;
      border-radius: 5px;
    }

    /* Accordion (Detalhes por hora) */
    .accordion-card {
      margin-top: -4px;
      margin-bottom: 10px;
      padding: 10px;
      border: 3px dashed #f5f5f5;
      border-radius: 8px;
    }

    .hourly-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 10px;
    }

    .hourly-item {
      display: flex;
      flex-direction: column;
      border: 2px solid #f5f5f5;
      border-radius: 8px;
      gap: 10px;
      margin-bottom: 0;
      cursor: default;
      padding: 8px 12px;
    }

    .hourly-hour {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      font-size: 13px;
      color: #0f172a;
      border-radius: 8px;
    }

    .hourly-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 8px;
    }

    .tab-btn {
      flex: 1;
      border: 1px solid #cbd5e1;
      background-color: white;
      padding: 6px 2px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
      font-family: "Google Sans", sans-serif;
    }

    .tab-btn:hover {
      background-color: #f1f5f9;
    }

    .period-rain-summary {
      font-size: 12px;
      color: #334155;
      background: #e2e8f0;
      padding: 8px 10px;
      border-radius: 6px;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <h1>Previsão do Tempo</h1>

  <div id="search-box-container" class="search-container">
    <input type="text" id="city-input" placeholder="Digite o nome da cidade..." autocomplete="off">
    <div id="suggestions" class="suggestions" style="display: none;"></div>
  </div>

  <div id="weather-card" class="card" style="display: none;">
    <div id="location-name" class="location-header"></div>
    <div id="location-coords" class="coords"></div>
    <div class="data-source">Fonte dos dados: ECMWF HRES 9km / Open-Meteo API</div>

    <h3>Previsão Diária <small style="font-size: 12px; font-weight: normal; color: #666;">(Toque/clique para ver detalhes)</small></h3>
    
    <div id="forecast-container"></div>

    <div id="long-term-rain-summary" class="period-rain-summary"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
