<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Previsão do Tempo - ECMWF</title>
  <link rel="stylesheet" href="styles.css">

  <!-- 1º Carrega a biblioteca principal do Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- 2º Carrega o plugin do DataLabels (depende do Chart.js) -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
</head>
<body>

  <header>
    <h1>Previsão do Tempo</h1>
    <div class="search-container">
      <input type="text" id="city-search" placeholder="Buscar cidade..." autocomplete="off">
      <div id="search-suggestions" hidden></div>
    </div>
  </header>

  <div class="history" id="search-history"></div>

  <div class="mapas-chuva">
    <a href="mapas.html" target="_blank">Mapas de chuva</a>
  </div>

  <main>
    <div class="current-location" id="current-location"></div>

    <section id="forecast-container">
      <!-- Cards diários serão inseridos aqui via JS -->
    </section>
  </main>

  <!-- 3º Carrega a lógica da sua aplicação por último -->
  <script src="app.js"></script>
  
</body>
</html>
